[package]
name = "ejson"
version = "0.0.9"
edition = "2021"
authors = ["Trung Lê <8@tle.id.au>"]
description = "Manage encrypted secrets using public key encryption"
license = "MIT"
repository = "https://github.com/runlevel5/ejson-rs"
keywords = ["encryption", "secrets", "json", "toml", "yaml"]
categories = ["cryptography", "command-line-utilities"]

[dependencies]
# Cryptography
crypto_box = "0.9"
rand = "0.8"
zeroize = { version = "1.8", features = ["derive"] }
subtle = "2.6"

# CLI
clap = { version = "4.5", features = ["derive", "env"] }

# JSON
serde_json = "1.0"

# TOML
toml = "0.9"
toml_edit = "0.24"

# YAML
serde = { version = "1.0", features = ["derive"] }
serde_yml = "0.0.12"

# Encoding
base64 = "0.22"
hex = "0.4"

# Error handling
thiserror = "2.0"
anyhow = "1.0"

# Regex for message parsing
regex = "1.12"

# File locking
fs4 = "0.12"

[dev-dependencies]
tempfile = "3.24"

[[bin]]
name = "ejson"
path = "src/main.rs"

[lib]
name = "ejson"
path = "src/lib.rs"
