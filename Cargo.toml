[package]
name = "ejson"
version = "1.0.6"
edition = "2024"
rust-version = "1.96.1"
authors = ["Trung Lê <8@tle.id.au>"]
description = "Manage encrypted secrets using public key encryption"
license = "MIT"
repository = "https://github.com/runlevel5/ejson-rs"
homepage = "https://github.com/runlevel5/ejson-rs"
keywords = ["encryption", "secrets", "json", "toml", "yaml"]
categories = ["cryptography", "command-line-utilities"]
readme = "README.md"
exclude = ["/.github", "/benches", ".pre-commit-hooks.yaml", ".tool-versions", "/man", "/target", ".gitignore", "ejson-demo.gif", "/build", "/.copr", "/Formula"]

[dependencies]
# Cryptography (v1 legacy NaCl box)
crypto_box = "0.9"
zeroize = { version = "1.8", features = ["derive"] }

# Cryptography (v3 hybrid post-quantum: X25519 + ML-KEM-768 -> HKDF-SHA256 -> XChaCha20-Poly1305)
ml-kem = { version = "0.3.2", features = ["getrandom"] }
hkdf = "0.13"
sha2 = "0.11"
chacha20poly1305 = { version = "0.11", features = ["getrandom"] }
x25519-dalek = { version = "3.0", features = ["getrandom", "static_secrets", "zeroize"] }

# CLI
clap = { version = "4.6", features = ["derive", "env"] }

# JSON
serde_json = "1.0"

# TOML
toml = "1.0"
toml_edit = "0.25"

# YAML
serde_norway = "0.9"

# Encoding
base64 = "0.22"
hex = "0.4"

# Error handling
thiserror = "2.0"

# File locking
fs4 = "0.13"

# Parallelism (optional)
rayon = { version = "1.10", optional = true }

[features]
default = []
parallel = ["rayon"]

[dev-dependencies]
tempfile = "3.24"

[[bin]]
name = "ejson"
path = "src/main.rs"

[lib]
name = "ejson"
path = "src/lib.rs"

[[bench]]
name = "encryption_benchmark"
harness = false
