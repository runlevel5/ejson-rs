[package]
name = "ejson"
version = "1.0.6"
edition = "2024"
rust-version = "1.99.1"
authors = ["Trung Lê <8@tle.id.au>"]
description = "Manage encrypted secrets using public key encryption"
license = "MIT"
repository = "https://github.com/runlevel5/ejson-rs"
homepage = "https://github.com/runlevel5/ejson-rs"
keywords = ["encryption", "secrets", "json", "toml", "yaml"]
categories = ["cryptography", "command-line-utilities"]
readme = "README.md"
exclude = ["/.github", "/benches", ".pre-commit-hooks.yaml", ".tool-versions", "/man", "/target", ".gitignore", "ejson-demo.gif", "/Formula", "/fuzz"]

[dependencies]
# Cryptography (v1 legacy NaCl box)
crypto_box = "0.9"
zeroize = { version = "1.8", features = ["derive"] }

# Cryptography (v3 hybrid post-quantum: X25519 + ML-KEM-768 -> HKDF-SHA256 -> XChaCha20-Poly1305)
ml-kem = { version = "0.3.2", features = ["getrandom", "zeroize"] }
hkdf = "0.13"
sha2 = { version = "0.11", features = ["zeroize"] }
chacha20poly1305 = { version = "0.11", features = ["getrandom", "zeroize"] }
x25519-dalek = { version = "3.0", features = ["getrandom", "static_secrets", "zeroize"] }

# CLI
clap = { version = "4.6", features = ["derive", "env"] }

# JSON
serde = "1.0"
serde_json = "1.0"

# TOML
toml = "1.0"
toml_edit = "0.25"

# YAML
serde_norway = "0.9"

# Encoding
base64 = "0.23"
hex = "0.4"

# Error handling
thiserror = "2.0"

# Warnings from the library (the CLI prints them to stderr)
log = "0.4"

[target.'cfg(unix)'.dependencies]
# Process hardening (disable core dumps)
rustix = { version = "1.1", features = ["process"] }

[dev-dependencies]
tempfile = "3.24"

[[bin]]
name = "ejson"
path = "src/main.rs"

[lib]
name = "ejson"
path = "src/lib.rs"

[[bench]]
name = "encryption_benchmark"
harness = false

# Keep integer-overflow checks in release builds of our own code (they are on
# by default only in debug builds). The hand-written JSON scanner and the size
# and offset arithmetic then panic on an overflow instead of wrapping silently.
# Dependencies, including the crypto crates, keep the default release settings
# their authors test with.
[profile.release.package.ejson]
overflow-checks = true
