[package]
name = "ejson"
version = "1.0.1"
edition = "2021"
authors = ["Trung Lê <8@tle.id.au>"]
description = "Manage encrypted secrets using public key encryption"
license = "MIT"
repository = "https://github.com/runlevel5/ejson-rs"
keywords = ["encryption", "secrets", "json", "toml", "yaml"]
categories = ["cryptography", "command-line-utilities"]

[dependencies]
# Cryptography
crypto_box = "0.9"
zeroize = { version = "1.8", features = ["derive"] }

# CLI
clap = { version = "4.5", features = ["derive", "env"] }

# JSON
serde_json = "1.0"

# TOML
toml = "0.9"
toml_edit = "0.24"

# YAML
serde_norway = "0.9"

# Encoding
base64 = "0.22"
hex = "0.4"

# Error handling
thiserror = "2.0"

# Regex for message parsing
regex = "1.12"

# File locking
fs4 = "0.13"

# Parallelism (optional)
rayon = { version = "1.10", optional = true }

[features]
default = []
parallel = ["rayon"]

[dev-dependencies]
tempfile = "3.24"

[[bin]]
name = "ejson"
path = "src/main.rs"

[lib]
name = "ejson"
path = "src/lib.rs"

[[bench]]
name = "encryption_benchmark"
harness = false
