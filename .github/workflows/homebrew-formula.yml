name: Update Homebrew Formula

# Regenerates Formula/ejson.rb from a release's assets and opens a PR — nobody
# has to hand-copy version numbers or sha256 checksums.
#
# Called from release.yml after it publishes a release. It cannot use an
# `on: release` trigger for that: the release is created with the workflow's
# default GITHUB_TOKEN, and events created by that token never trigger other
# workflows (GitHub's recursion guard). Running as a job of the same release
# run avoids the problem entirely. The workflow_dispatch trigger is a manual
# fallback for backfilling a missed release.
on:
  workflow_call:
    inputs:
      tag:
        description: "Release tag to build the formula from (e.g. v1.0.5)"
        required: true
        type: string
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to build the formula from (e.g. v1.0.5)"
        required: true
        type: string

permissions:
  contents: write
  pull-requests: write

jobs:
  update-formula:
    name: Update Formula
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          # Nothing is pushed with git: the commit is made through the API.
          persist-credentials: false

      - name: Download release assets and compute checksums
        id: checksums
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          VERSION="${TAG#v}"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

          declare -A TARGETS=(
            [macos_arm]=aarch64-apple-darwin
            [macos_intel]=x86_64-apple-darwin
            [linux_arm]=aarch64-unknown-linux-gnu
            [linux_intel]=x86_64-unknown-linux-gnu
          )
          for key in "${!TARGETS[@]}"; do
            asset="ejson-${VERSION}-${TARGETS[$key]}.tar.xz"
            gh release download "$TAG" -p "$asset" -O "$asset" --clobber
            sha="$(sha256sum "$asset" | cut -d' ' -f1)"
            echo "${key}_sha=${sha}" >> "$GITHUB_OUTPUT"
          done

      - name: Regenerate Formula/ejson.rb
        env:
          VERSION: ${{ steps.checksums.outputs.version }}
          MACOS_ARM_SHA: ${{ steps.checksums.outputs.macos_arm_sha }}
          MACOS_INTEL_SHA: ${{ steps.checksums.outputs.macos_intel_sha }}
          LINUX_ARM_SHA: ${{ steps.checksums.outputs.linux_arm_sha }}
          LINUX_INTEL_SHA: ${{ steps.checksums.outputs.linux_intel_sha }}
        run: |
          cat > Formula/ejson.rb <<EOF
          # Generated by .github/workflows/homebrew-formula.yml on every
          # release; do not hand-edit the version or sha256 values.
          class Ejson < Formula
            desc "Manage encrypted secrets using public key encryption"
            homepage "https://github.com/runlevel5/ejson-rs"
            version "${VERSION}"
            license "MIT"

            on_macos do
              on_arm do
                url "https://github.com/runlevel5/ejson-rs/releases/download/v#{version}/ejson-#{version}-aarch64-apple-darwin.tar.xz"
                sha256 "${MACOS_ARM_SHA}"
              end
              on_intel do
                url "https://github.com/runlevel5/ejson-rs/releases/download/v#{version}/ejson-#{version}-x86_64-apple-darwin.tar.xz"
                sha256 "${MACOS_INTEL_SHA}"
              end
            end

            on_linux do
              on_arm do
                url "https://github.com/runlevel5/ejson-rs/releases/download/v#{version}/ejson-#{version}-aarch64-unknown-linux-gnu.tar.xz"
                sha256 "${LINUX_ARM_SHA}"
              end
              on_intel do
                url "https://github.com/runlevel5/ejson-rs/releases/download/v#{version}/ejson-#{version}-x86_64-unknown-linux-gnu.tar.xz"
                sha256 "${LINUX_INTEL_SHA}"
              end
            end

            def install
              bin.install "ejson"
            end

            test do
              assert_match version.to_s, shell_output("#{bin}/ejson --version")
            end
          end
          EOF

      - name: Open PR
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.checksums.outputs.version }}
        run: |
          set -euo pipefail
          if git diff --quiet -- Formula/ejson.rb; then
            echo "Formula already up to date; nothing to do."
            exit 0
          fi

          BRANCH="homebrew-formula-v${VERSION}"
          TITLE="chore: bump Homebrew formula to v${VERSION}"
          BASE_SHA=$(git rev-parse HEAD)

          # Start the branch from main, or reset it there if a previous run
          # left it behind.
          if gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/${BRANCH}" > /dev/null 2>&1; then
            gh api -X PATCH "repos/${GITHUB_REPOSITORY}/git/refs/heads/${BRANCH}" \
              -f sha="$BASE_SHA" -F force=true > /dev/null
          else
            gh api "repos/${GITHUB_REPOSITORY}/git/refs" \
              -f ref="refs/heads/${BRANCH}" -f sha="$BASE_SHA" > /dev/null
          fi

          # Commit through the API rather than with `git commit`: GitHub signs
          # commits made this way, so they show as Verified. A runner has no
          # key to sign with, and a branch rule that requires signed commits
          # would otherwise block the pull request.
          gh api -X PUT "repos/${GITHUB_REPOSITORY}/contents/Formula/ejson.rb" \
            -f message="$TITLE" \
            -f branch="$BRANCH" \
            -f sha="$(git rev-parse HEAD:Formula/ejson.rb)" \
            -f content="$(base64 -w0 Formula/ejson.rb)" \
            --jq '"committed \(.commit.sha), verified: \(.commit.verification.verified)"'

          if gh pr view "$BRANCH" > /dev/null 2>&1; then
            echo "A pull request for $BRANCH already exists; it now has the new commit."
          else
            gh pr create \
              --title "$TITLE" \
              --body "Automated bump of \`Formula/ejson.rb\` to v${VERSION}. Checksums computed directly from the release assets by this workflow." \
              --base main \
              --head "$BRANCH"
          fi
